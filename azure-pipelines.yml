trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: windows-latest

variables:
  nodeVersion: "20.9.0"
  npmVersion: "10.9.2"
  siteOutputDir: "radebe-web/dist"
  cloudflareProjectName: "radebe"
  productionBranch: "refs/heads/master"
  cloudflareProductionBranch: "master"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "$(nodeVersion)"
    displayName: Use Node.js

  - script: |
      npm install --global npm@$(npmVersion)
      node --version
      npm --version
    displayName: Pin npm

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build:release:web
    displayName: Build release downloads and website

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: "$(Build.SourcesDirectory)/radebe-web/dist"
      artifact: "radebe-web-dist"
    displayName: Publish website artifact

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: "$(Build.SourcesDirectory)/Temp"
      artifact: "radebe-release-downloads"
    displayName: Publish packaged download artifacts

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: "$(Build.SourcesDirectory)/artifacts/radebe-cli/sea/win32-x64"
      artifact: "radebe-cli-win32-x64"
    displayName: Publish Windows CLI payload

  - script: |
      curl.exe --fail --silent --show-error ^
        --request PATCH ^
        "https://api.cloudflare.com/client/v4/accounts/$(CLOUDFLARE_ACCOUNT_ID)/pages/projects/$(cloudflareProjectName)" ^
        --header "Authorization: Bearer $(CLOUDFLARE_API_TOKEN)" ^
        --header "Content-Type: application/json" ^
        --data "{\"production_branch\":\"$(cloudflareProductionBranch)\"}"
    displayName: Ensure Cloudflare production branch
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['productionBranch']), ne(variables['Build.Reason'], 'PullRequest'))

  - script: |
      npm install --global wrangler
      wrangler pages deploy "$(siteOutputDir)" --project-name "$(cloudflareProjectName)" --branch "$(cloudflareProductionBranch)"
    displayName: Deploy to Cloudflare Pages
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['productionBranch']), ne(variables['Build.Reason'], 'PullRequest'))
    env:
      CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
      CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
