trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

variables:
  - group: Radebe Variables
  - name: nodeVersion
    value: "20.18.1"
  - name: npmVersion
    value: "10.9.2"
  - name: siteOutputDir
    value: "radebe-web/dist"
  - name: cloudflareProjectName
    value: "radebe"
  - name: productionBranch
    value: "refs/heads/master"
  - name: cloudflareProductionBranch
    value: "master"

stages:
  - stage: Build
    displayName: Build Website
    jobs:
      - job: BuildWebsite
        displayName: Build on Linux
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(nodeVersion)"
            displayName: Use Node.js

          - script: |
              npm install --global npm@$(npmVersion)
              node --version
              npm --version
            displayName: Pin npm

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build:release:web
            displayName: Build website

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Build.SourcesDirectory)/radebe-web/dist"
              artifact: "radebe-web-dist"
            displayName: Publish website artifact

  - stage: Deploy
    displayName: Deploy Website
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['productionBranch']), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DeployCloudflarePages
        displayName: Deploy on Linux
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(nodeVersion)"
            displayName: Use Node.js

          - script: |
              npm install --global npm@$(npmVersion)
              node --version
              npm --version
            displayName: Pin npm

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: "radebe-web-dist"
              path: "$(Pipeline.Workspace)/radebe-web-dist"
            displayName: Download website artifact

          - script: |
              set -e
              curl --fail --silent --show-error \
                --request PATCH \
                "https://api.cloudflare.com/client/v4/accounts/$(CLOUDFLARE_ACCOUNT_ID)/pages/projects/$(cloudflareProjectName)" \
                --header "Authorization: Bearer $(CLOUDFLARE_API_TOKEN)" \
                --header "Content-Type: application/json" \
                --data "{\"production_branch\":\"$(cloudflareProductionBranch)\"}"
            displayName: Ensure Cloudflare production branch

          - script: |
              npm install --global wrangler
              wrangler pages deploy "$(Pipeline.Workspace)/radebe-web-dist" --project-name "$(cloudflareProjectName)" --branch "$(cloudflareProductionBranch)"
            displayName: Deploy to Cloudflare Pages
            env:
              CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
